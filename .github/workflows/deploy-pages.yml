name: Deploy web to Cloudflare Pages

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CF_API_TOKEN CF_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in GitHub Actions"
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Web app
        run: bash ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Check build output
        run: test -f webApp/build/dist/wasmJs/productionExecutable/index.html

      - name: Ensure Pages production branch
        if: github.ref_name == 'xiaoqing-island'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/muse-island"
          project=$(curl --fail --silent --show-error "$project_url" \
            --header "Authorization: Bearer ${CF_API_TOKEN}")
          branch=$(jq -r '.result.production_branch // empty' <<< "$project")
          if [ "$branch" != "xiaoqing-island" ]; then
            curl --fail --silent --show-error --request PATCH "$project_url" \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"production_branch":"xiaoqing-island"}' \
              | jq -e '.success and (.result.production_branch == "xiaoqing-island")' > /dev/null
          fi

      - name: Deploy to Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: pages deploy webApp/build/dist/wasmJs/productionExecutable --project-name=muse-island --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Check production deployment
        if: github.ref_name == 'xiaoqing-island'
        env:
          PAGES_ENVIRONMENT: ${{ steps.pages.outputs.pages-environment }}
        run: |
          if [ "$PAGES_ENVIRONMENT" != "production" ]; then
            echo "::error::Pages project production branch must be xiaoqing-island"
            exit 1
          fi
